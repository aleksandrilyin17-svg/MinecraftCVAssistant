name: Build Windows App

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-opencv
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-nlohmann-json

      - name: Build with CMake
        shell: msys2 {0}
        run: |
          mkdir -p build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..
          ninja

      - name: Bundle DLLs for Portable Run
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp build/MinecraftCVAssistant.exe dist/
          windeployqt6 dist/MinecraftCVAssistant.exe
          ldd build/MinecraftCVAssistant.exe | grep "/ucrt64/bin/" | awk '{print $3}' | xargs -I {} cp -f {} dist/

      - name: Upload Portable App
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftCVAssistant-Portable
          path: dist/
