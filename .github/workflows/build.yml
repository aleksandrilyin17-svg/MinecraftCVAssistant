name: Build Windows App

on: [push]

jobs:
  build:
      runs-on: windows-latest
      steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-opencv
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-nlohmann-json

      - name: Build with g++
        shell: msys2 {0}
        run: |
          g++ main.cpp -o MinecraftCVAssistant.exe -std=c++17 -O2 $(pkg-config --cflags --libs Qt6Widgets opencv4 libcurl) -lgdi32 -luser32

      - name: Upload compiled EXE
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftCVAssistant-Windows
          path: MinecraftCVAssistant.exe
